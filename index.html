<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcel Corradi — Product Designer · Design Systems</title>
    <meta
      name="description"
      content="Product Designer specialized in Design Systems, with a Computer Science background. Selected work and case studies."
    />
    <script type="text/javascript">
      // Restores the deep link that 404.html encoded as a query, so the SPA
      // router sees the real path. Pairs with public/404.html.
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
