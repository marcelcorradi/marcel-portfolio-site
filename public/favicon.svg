<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Marcel Corradi. A white M knocked out of an indigo tile.

    The tile is not decoration: at 16px a bare letter in brand colour loses its
    edge against the tab strip, pale on a light one and muddy on a dark one. The
    field gives the mark its own contrast, so the icon reads the same wherever
    it lands, and the knockout keeps the counters open at the smallest size.

    The fill tracks the primary token in src/index.css: indigo-600 in light, the
    lighter indigo the dark theme already uses. Favicons honour
    prefers-color-scheme, so one file covers browsers that theme their chrome.
    Values are literal because a favicon is fetched outside the page and cannot
    see the app's CSS variables; if the primary token changes, change these two.
  -->
  <style>
    .tile { fill: #4F46E5; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #6366F1; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <path fill="#fff" d="M14 48V16h6.2l11.8 17.4L43.8 16H50v32h-6.4V27.2L33.6 41.6h-3.2L20.4 27.2V48H14z"/>
</svg>
